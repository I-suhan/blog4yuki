                <h4># 一笔画</h4>
                <p>一笔画图形：不抬笔，不回笔，最少可以一笔画成的图形</p>
                <p>连通图中，奇点数=0或者2是一笔画图形</p>
                <p>连通图中，奇点数 &gt; 4 时，最少笔画数 = 奇点数 / 2</p>
                <p>奇点：一个点（包括端点）射出的射线数为奇数</p>
